global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: room-booking-api
    static_configs:
      - targets:
          - room-booking-api:8000

  - job_name: room-booking-grpc
    static_configs:
      - targets:
          - room-booking-grpc:9102

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090